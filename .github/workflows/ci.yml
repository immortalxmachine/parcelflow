name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check src tests dashboard

      - name: Run tests
        run: pytest -q

      - name: Pipeline smoke test (SQLite + local storage)
        run: |
          python pipeline.py initdb --reset
          python pipeline.py run --date 2024-10-20
          python pipeline.py status
